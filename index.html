<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>İtalyanca Kelimeler - Flashcards</title>
  <style>
    :root {
      --bg-color: #FAF6F0;
      --card-front-bg: #FFFFFF;
      --card-back-bg: #FFF5E4;
      --text-main: #3C2A21;
      --text-muted: #8C7A6B;
      --accent-orange: #E88D36;
      --accent-green: #4E9F3D;
      --accent-red: #D9534F;
      --btn-bg: #F3E9DC;
      --border-color: #E6D5C3;
      --shadow: 0 10px 25px rgba(60, 42, 33, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px 15px;
    }

    header {
      width: 100%;
      max-width: 600px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .brand { font-size: 1.5rem; font-weight: 700; font-style: italic; font-family: Georgia, serif; }
    .brand span { color: var(--accent-orange); }

    .counter-badge {
      background: var(--btn-bg);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      color: var(--text-muted);
      border: 1px solid var(--border-color);
    }

    .title-area { text-align: center; margin-bottom: 15px; }
    .title-area h1 { font-family: Georgia, serif; font-size: 2.2rem; margin-bottom: 5px; }
    .title-area h1 span { color: var(--accent-orange); font-style: italic; }
    .title-area p { color: var(--text-muted); font-size: 0.9rem; }

    .stats-summary {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin: 15px 0;
    }
    .stat-box {
      background: #EFE4D4;
      padding: 6px 16px;
      border-radius: 16px;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .stat-box.val-toplam { color: var(--text-main); }
    .stat-box.val-dogru { color: var(--accent-green); }
    .stat-box.val-yanlis { color: var(--accent-red); }

    .categories-wrapper {
      width: 100%;
      max-width: 600px;
      overflow-x: auto;
      white-space: nowrap;
      padding: 5px 0 15px 0;
      margin-bottom: 10px;
    }
    .categories-wrapper::-webkit-scrollbar { height: 4px; }
    .categories-wrapper::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }

    .cat-btn {
      display: inline-block;
      padding: 8px 16px;
      margin-right: 8px;
      background: #EFE4D4;
      border: 1px solid var(--border-color);
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      color: var(--text-main);
      transition: all 0.2s;
    }
    .cat-btn.active {
      background: var(--accent-orange);
      color: #FFF;
      border-color: var(--accent-orange);
    }

    .search-box {
      width: 100%;
      max-width: 600px;
      margin-bottom: 15px;
    }
    .search-box input {
      width: 100%;
      padding: 12px 20px;
      border-radius: 25px;
      border: 1px solid var(--border-color);
      outline: none;
      background: #FFF;
      font-size: 0.95rem;
    }

    .progress-bar-container {
      width: 100%;
      max-width: 600px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
    }
    .progress-bar-bg {
      flex: 1;
      height: 4px;
      background: var(--border-color);
      border-radius: 2px;
      margin-right: 15px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--accent-orange);
      width: 0%;
      transition: width 0.3s;
    }
    .progress-text { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; }

    /* Flashcard */
    .card-container {
      width: 100%;
      max-width: 600px;
      height: 320px;
      perspective: 1000px;
      cursor: pointer;
      margin-bottom: 25px;
    }
    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
    }
    .card-container.flipped .card-inner { transform: rotateY(180deg); }

    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 25px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid rgba(230, 213, 195, 0.5);
    }

    .card-front { background: var(--card-front-bg); }
    .card-back { background: var(--card-back-bg); transform: rotateY(180deg); }

    .card-badge {
      align-self: flex-start;
      background: #F5EBE0;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    .card-word { font-family: Georgia, serif; font-size: 2.2rem; font-weight: bold; margin: auto 0; }
    .card-word span.lang-label { display: block; font-size: 0.75rem; font-family: sans-serif; letter-spacing: 2px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; font-weight: 500; }
    
    .card-hint { font-size: 0.8rem; color: var(--text-muted); align-self: flex-end; }

    .example-box {
      background: rgba(232, 141, 54, 0.1);
      padding: 10px 15px;
      border-radius: 12px;
      font-style: italic;
      font-size: 0.9rem;
      margin-top: 10px;
    }
    
    .verb-details {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 10px 0;
    }
    .verb-pill {
      display: flex;
      flex-direction: column;
      font-size: 0.8rem;
    }
    .verb-pill .label { color: var(--text-muted); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; }
    .verb-pill .val { font-weight: bold; color: var(--accent-orange); }

    .aux-badge {
      display: inline-block;
      background: #D5EEEA;
      color: #2D6A4F;
      padding: 2px 10px;
      border-radius: 10px;
      font-size: 0.75rem;
      font-weight: 600;
      margin-top: 5px;
    }

    /* Controls */
    .controls-main {
      display: flex;
      gap: 12px;
      width: 100%;
      max-width: 600px;
      margin-bottom: 15px;
    }
    .btn-action {
      flex: 1;
      padding: 14px;
      border-radius: 16px;
      border: none;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.1s;
    }
    .btn-action:active { transform: scale(0.98); }
    .btn-bilmedim { background: #FCE8E6; color: var(--accent-red); border: 1px solid #F5C6CB; }
    .btn-atla { background: #EFE4D4; color: var(--text-main); border: 1px solid var(--border-color); }
    .btn-bildim { background: #E8F5E9; color: var(--accent-green); border: 1px solid #C8E6C9; }

    .bottom-stats {
      display: flex;
      gap: 15px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 20px;
    }
    .dot-dogru { color: var(--accent-green); }
    .dot-yanlis { color: var(--accent-red); }

    .controls-sub {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
      max-width: 600px;
    }
    .btn-sub {
      padding: 8px 14px;
      background: #FFF;
      border: 1px solid var(--border-color);
      border-radius: 20px;
      font-size: 0.8rem;
      cursor: pointer;
      color: var(--text-main);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">🇮🇹 <span>Italiano</span></div>
    <div class="counter-badge" id="headerCounter">Kelimeler · 0</div>
  </header>

  <div class="title-area">
    <h1>İtalyanca <span>Kelimeler</span></h1>
    <p id="totalInfoText">0 kelime · örnek cümleler</p>
    
    <div class="stats-summary">
      <div class="stat-box val-toplam">Toplam: <span id="statToplam">0</span></div>
      <div class="stat-box val-dogru">Doğru: <span id="statDogru">0</span></div>
      <div class="stat-box val-yanlis">Yanlış: <span id="statYanlis">0</span></div>
    </div>
  </div>

  <div class="categories-wrapper" id="categoriesContainer">
    <!-- Kategoriler JS ile dolacak -->
  </div>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Kelime ara... (it/tr veya örnek cümle)">
  </div>

  <div class="progress-bar-container">
    <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill"></div></div>
    <div class="progress-text" id="progressText">0 / 0</div>
  </div>

  <div class="card-container" id="cardContainer" onclick="flipCard()">
    <div class="card-inner">
      <div class="card-front" id="cardFront">
        <!-- Ön Yüz -->
      </div>
      <div class="card-back" id="cardBack">
        <!-- Arka Yüz -->
      </div>
    </div>
  </div>

  <div class="controls-main">
    <button class="btn-action btn-bilmedim" onclick="markAnswer(false)">✕ Bilmedim</button>
    <button class="btn-action btn-atla" onclick="skipCard()">→ Atla</button>
    <button class="btn-action btn-bildim" onclick="markAnswer(true)">✓ Bildim</button>
  </div>

  <div class="bottom-stats">
    <span class="dot-dogru">● <span id="bottomDogru">0</span> doğru</span>
    <span class="dot-yanlis">● <span id="bottomYanlis">0</span> yanlış</span>
  </div>

  <div class="controls-sub">
    <button class="btn-sub" onclick="shuffleCards()">⇄ Karıştır</button>
    <button class="btn-sub" onclick="resetCards()">↺ Başa dön</button>
    <button class="btn-sub" onclick="filterWrongCards()">✕ Yanlışlar</button>
  </div>

      { it: "Il medico / La medica", tr: "The doctor / Doktor", cat: "Meslekler" },

      { it: "L'avvocato", tr: "The lawyer / Avukat", cat: "Meslekler" },
      { it: "Il psicologo / La psicologa", tr: "Psychologist / Psikolog", cat: "Meslekler" },
      { it: "Il cameriere / La cameriera", tr: "Waiter / Garson", cat: "Meslekler" },
      { it: "Il cuoco / La cuoca", tr: "Chef / Aşçı", cat: "Meslekler" }
    ];

    let currentList = [...wordsData];
    let currentIndex = 0;
    let knownSet = new Set();
    let unknownSet = new Set();
    let currentCategory = "Tümü";

    // Dinamik Kategori Oluşturma
    function initCategories() {
      const catContainer = document.getElementById("categoriesContainer");
      const catCountMap = {};

      wordsData.forEach(item => {
        const cat = item.cat || "Genel";
        catCountMap[cat] = (catCountMap[cat] || 0) + 1;
      });

      const categories = ["Tümü", ...Object.keys(catCountMap)];
      
      catContainer.innerHTML = categories.map(cat => {
        const count = cat === "Tümü" ? wordsData.length : catCountMap[cat];
        return `<button class="cat-btn ${cat === 'Tümü' ? 'active' : ''}" onclick="selectCategory('${cat}', this)">${cat} (${count})</button>`;
      }).join('');
    }

    function selectCategory(cat, btn) {
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentCategory = cat;
      filterList();
    }

    function filterList() {
      const searchVal = document.getElementById("searchInput").value.toLowerCase();
      
      currentList = wordsData.filter(item => {
        const matchCat = (currentCategory === "Tümü") || (item.cat === currentCategory);
        const matchSearch = item.it.toLowerCase().includes(searchVal) || 
                            item.tr.toLowerCase().includes(searchVal) ||
                            (item.example && item.example.toLowerCase().includes(searchVal));
        return matchCat && matchSearch;
      });

      currentIndex = 0;
      updateUI();
    }

    document.getElementById("searchInput").addEventListener("input", filterList);

    function updateUI() {
      const totalWords = wordsData.length;
      document.getElementById("headerCounter").innerText = `Kelimeler · ${totalWords}`;
      document.getElementById("totalInfoText").innerText = `${totalWords} kelime · örnek cümleler`;
      
      document.getElementById("statToplam").innerText = currentList.length;
      document.getElementById("statDogru").innerText = knownSet.size;
      document.getElementById("statYanlis").innerText = unknownSet.size;

      document.getElementById("bottomDogru").innerText = knownSet.size;
      document.getElementById("bottomYanlis").innerText = unknownSet.size;

      const progressFill = document.getElementById("progressFill");
      const progressText = document.getElementById("progressText");

      if (currentList.length === 0) {
        progressFill.style.width = "0%";
        progressText.innerText = "0 / 0";
        renderEmptyCard();
        return;
      }

      const currentNum = currentIndex + 1;
      progressFill.style.width = `${(currentNum / currentList.length) * 100}%`;
      progressText.innerText = `${currentNum} / ${currentList.length}`;

      renderCardContent(currentList[currentIndex]);
    }

    function renderCardContent(item) {
      const container = document.getElementById("cardContainer");
      container.classList.remove("flipped");

      const cardFront = document.getElementById("cardFront");
      const cardBack = document.getElementById("cardBack");

      cardFront.innerHTML = `
        <div class="card-badge">${item.cat || 'Genel'}</div>
        <div class="card-word">
          <span class="lang-label">İTALYANCA</span>
          ${item.it}
        </div>
        <div class="card-hint">çevir →</div>
      `;

      let backHTML = `
        <div class="card-badge">${item.cat || 'Genel'}</div>
        <div class="card-word">
          <span class="lang-label">TÜRKÇE / İNGİLİZCE</span>
          ${item.tr}
        </div>
      `;

      if (item.isVerb) {
        backHTML += `
          <div class="verb-details">
            <div class="verb-pill"><span class="label">PRESENTE</span><span class="val">${item.presente || '-'}</span></div>
            <div class="verb-pill"><span class="label">PARTICİPİO</span><span class="val">${item.participio || '-'}</span></div>
          </div>
          ${item.aux ? `<div class="aux-badge">aux: ${item.aux}</div>` : ''}
        `;
      }

      if (item.example) {
        backHTML += `
          <div class="example-box">
            ✦ ${item.example}
          </div>
        `;
      }

      backHTML += `<div class="card-hint">kartı çevir ↺</div>`;
      cardBack.innerHTML = backHTML;
    }

    function renderEmptyCard() {
      document.getElementById("cardFront").innerHTML = `<div style="margin:auto;">Sonuç bulunamadı!</div>`;
      document.getElementById("cardBack").innerHTML = `<div style="margin:auto;">Sonuç bulunamadı!</div>`;
    }

    function flipCard() {
      if (currentList.length > 0) {
        document.getElementById("cardContainer").classList.toggle("flipped");
      }
    }

    function nextCard() {
      if (currentIndex < currentList.length - 1) {
        currentIndex++;
      } else {
        currentIndex = 0;
      }
      updateUI();
    }

    function markAnswer(isKnown) {
      if (currentList.length === 0) return;
      
      const currentWord = currentList[currentIndex].it;
      if (isKnown) {
        knownSet.add(currentWord);
        unknownSet.delete(currentWord);
      } else {
        unknownSet.add(currentWord);
        knownSet.delete(currentWord);
      }
      
      nextCard();
    }

    function skipCard() {
      nextCard();
    }

    function shuffleCards() {
      for (let i = currentList.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [currentList[i], currentList[j]] = [currentList[j], currentList[i]];
      }
      currentIndex = 0;
      updateUI();
    }

    function resetCards() {
      currentIndex = 0;
      knownSet.clear();
      unknownSet.clear();
      filterList();
    }

    function filterWrongCards() {
      if (unknownSet.size === 0) {
        alert("Henüz yanlış işaretlenmiş bir kelime yok!");
        return;
      }
      currentList = wordsData.filter(item => unknownSet.has(item.it));
      currentIndex = 0;
      updateUI();
    }

    // İlk Çalıştırma
    initCategories();
    updateUI();
  </script>
